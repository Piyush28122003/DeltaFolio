# File: src/main/resources/application.properties

spring.application.name=portfolio-manager

spring.datasource.url=jdbc:mysql://localhost:3306/portfolio
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Optional SQL init (commented)
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.schema-locations=classpath:schema.sql

server.port=8080
server.servlet.context-path=/

# External API Configuration
external.stock-api.provider=alpha-vantage
external.stock-api.alpha-vantage.base-url=https://www.alphavantage.co/query
external.stock-api.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:demo}
external.stock-api.finnhub.base-url=https://finnhub.io/api/v1
external.stock-api.finnhub.api-key=${FINNHUB_API_KEY:demo}
external.stock-api.yahoo-finance.base-url=https://query1.finance.yahoo.com/v8/finance/chart

external.gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
external.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
external.gemini.model=gemini-pro

external.newsapi.base-url=https://newsapi.org/v2
external.newsapi.api-key=${NEWSAPI_API_KEY:ebfd4af70ccd48c287c89c51f44d6e8a}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
jwt.expiration=86400000

# Application Configuration
app.name=DeltaFolio AI - Intelligent Portfolio Management with AI Insights
app.version=1.0.0

# Logging
logging.level.com.yourorg.portfolio=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
